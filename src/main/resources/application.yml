spring:
  application:
    name: packflow-backend
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/packflow}
    username: ${DATABASE_USERNAME:packflow}
    password: ${DATABASE_PASSWORD:packflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration: ${JWT_EXPIRATION:86400000}

server:
  shutdown: graceful
