# Local development template. Copy this file to application-local.yaml (which is gitignored).
# Do not put "spring.profiles.default" or "spring.profiles.active" here.
# Environment selection belongs in application.yml or the Spring Boot launch configuration.
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/packflow}
    username: ${DATABASE_USERNAME:packflow}
    password: ${DATABASE_PASSWORD:packflow}
  jpa:
    hibernate:
      ddl-auto: validate

# JWT_SECRET must be set in IntelliJ Run Configuration -> Environment variables.
# Do not commit the real signing key or bootstrap password.
